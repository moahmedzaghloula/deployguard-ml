name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: deployguard-ml
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install locked dependencies
        run: .venv/bin/python -m pip install --requirement requirements.lock.txt

      - name: Check formatting
        run: make format-check

      - name: Run Ruff
        run: make lint

  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install locked dependencies
        run: .venv/bin/python -m pip install --requirement requirements.lock.txt

      - name: Run tests with coverage
        run: make coverage

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  data:
    name: Reproducible dataset
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install locked dependencies
        run: .venv/bin/python -m pip install --requirement requirements.lock.txt

      - name: Generate dataset
        run: make data

      - name: Validate dataset
        run: make validate-data

      - name: Upload generated dataset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dataset-${{ github.sha }}
          path: data/raw/deployments.csv
          if-no-files-found: error
          retention-days: 7

  model:
    name: Model training and contract
    runs-on: ubuntu-24.04
    needs:
      - data

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install locked dependencies
        run: .venv/bin/python -m pip install --requirement requirements.lock.txt

      - name: Download generated dataset
        uses: actions/download-artifact@v8
        with:
          name: dataset-${{ github.sha }}
          path: data/raw

      - name: Revalidate dataset
        run: make validate-data

      - name: Train model
        run: make train

      - name: Validate model artifact contract
        run: make model-check

      - name: Upload model evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: model-${{ github.sha }}
          path: |
            artifacts/deployguard_model.joblib
            artifacts/metadata.json
            reports/metrics.json
          if-no-files-found: error
          retention-days: 7

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    needs:
      - quality
      - tests
      - model
      - dockerfile-lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download model evidence
        uses: actions/download-artifact@v8
        with:
          name: model-${{ github.sha }}
          path: .

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Inspect runtime user
        run: |
          test "$(
            docker image inspect \
              "${IMAGE_NAME}:${IMAGE_TAG}" \
              --format '{{.Config.User}}'
          )" = "10001:10001"

      - name: Export Docker image
        run: |
          docker save "${IMAGE_NAME}:${IMAGE_TAG}" \
            | gzip -1 \
            > deployguard-image.tar.gz

      - name: Upload Docker image evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-${{ github.sha }}
          path: deployguard-image.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  docker-smoke:
    name: Hardened container smoke test
    runs-on: ubuntu-24.04
    needs:
      - docker-build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: container-${{ github.sha }}
          path: .

      - name: Load Docker image
        run: gzip -dc deployguard-image.tar.gz | docker load

      - name: Run hardened container smoke test
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER="deployguard-ci"

          cleanup() {
            docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run \
            --detach \
            --name "${CONTAINER}" \
            --publish 127.0.0.1:8000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --memory 512m \
            --cpus 1.0 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          for attempt in $(seq 1 30); do
            status="$(
              docker inspect \
                --format '{{.State.Health.Status}}' \
                "${CONTAINER}"
                echo "Health check attempt ${attempt}: ${status}"
            )"

            if [ "${status}" = "healthy" ]; then
              break
            fi

            sleep 1
          done

          test "$(
            docker inspect \
              --format '{{.State.Health.Status}}' \
              "${CONTAINER}"
              echo "Health check attempt ${attempt}: ${status}"
          )" = "healthy"

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/health \
            >/dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/ready \
            >/dev/null

          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"files_changed":32,"lines_added":850,"lines_deleted":180,"test_coverage_percent":71.5,"failed_tests":2,"previous_deployment_failures":1,"deployment_hour":22,"is_weekend":1,"team_experience_months":18}' \
            http://127.0.0.1:8000/predict \
            >/dev/null

          test "$(
            docker exec "${CONTAINER}" id -u
          )" = "10001"

          test "$(
            docker inspect \
              "${CONTAINER}" \
              --format '{{.HostConfig.ReadonlyRootfs}}'
          )" = "true"

          docker inspect \
            "${CONTAINER}" \
            --format '{{json .HostConfig.CapDrop}}' \
            | grep -q '"ALL"'

          docker inspect \
            "${CONTAINER}" \
            --format '{{json .HostConfig.SecurityOpt}}' \
            | grep -q 'no-new-privileges=true'

          docker exec \
            "${CONTAINER}" \
            sh -c 'touch /tmp/ci-write-test && rm /tmp/ci-write-test'

          if docker exec \
            "${CONTAINER}" \
            touch /app/ci-should-not-write
          then
            echo "Container root filesystem is unexpectedly writable."
            exit 1
          fi

  vulnerability-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-24.04
    needs:
      - docker-build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: container-${{ github.sha }}
          path: .

      - name: Load Docker image
        run: gzip -dc deployguard-image.tar.gz | docker load

      - name: Generate full Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          output: trivy-report.txt
          exit-code: "0"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln

      - name: Enforce high-severity vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          skip-setup-trivy: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-${{ github.sha }}
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 7
